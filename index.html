<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b20">
  <meta name="description" content="BULBROWSER: абсурдный пародийный псевдобраузер с BulCoin, патриотическими сайтами и картофельными тайнами. Это сатира.">
  <title>BULBROWSER · Суверенный интернет</title>
  <link rel="icon" type="image/svg+xml" href="assets/potato-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="browser-frame" aria-label="Панель псевдобраузера BULBROWSER">
    <div class="tabbar">
      <div class="tab-holder" id="tabs"></div>
      <button class="bare icon-btn tab-add" id="newTab" title="Новая вкладка" aria-label="Новая вкладка">+</button>
      <div class="window-controls" aria-hidden="true"><span>−</span><span>▢</span><span>×</span></div>
    </div>
    <div class="toolbar">
      <div class="nav-buttons">
        <button class="bare icon-btn" id="back" title="Назад" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6M9 12h12"/></svg></button>
        <button class="bare icon-btn" id="forward" title="Вперёд" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6M15 12H3"/></svg></button>
        <button class="bare icon-btn" id="reload" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button>
        <button class="bare icon-btn" id="home" title="Главная" aria-label="Главная"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg></button>
      </div>
      <form id="addressForm" class="omnibox" autocomplete="off">
        <span class="omnibox-shield" title="Под усиленным картофельным надзором"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6zM12 6v12"/></svg></span>
        <input id="address" spellcheck="false" type="text" aria-label="Адресная строка" value="bul://home" placeholder="Введите адрес или разрешённый запрос">
        <span class="omnibox-caption">ИДЕОЛОГИЧЕСКИ ЗАЩИЩЕНО</span>
      </form>
      <button class="bare icon-btn toolbar-star" id="bookmark" title="В закладки" aria-label="В закладки">☆</button>
      <button class="top-coin" id="quickCoin" title="Личный счёт BulCoin"><span class="coin-dot">₿</span><span id="topBalance">7 450</span></button>
      <button class="bare icon-btn menu-toggle" id="menu" title="Меню" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>
  <div class="site-shell">
    <nav class="site-nav" aria-label="Разделы пародийного интернета">
      <button class="site-brand" data-nav="bul://home"><img src="assets/potato-mark.svg" alt="" width="39" height="39"><span>BUL<span>BROWSER</span></span></button>
      <div class="nav-scroll">
        <button class="nav-link" data-nav="bul://home"><span class="nav-emoji">⌂</span>Главная</button>
        <button class="nav-link" data-nav="bul://catalog"><span class="nav-emoji">▦</span>Одобренные сайты</button>
        <button class="nav-link" data-nav="bul://news"><span class="nav-emoji">☷</span>Государственные новости</button>
        <button class="nav-link" data-nav="bul://video"><span class="nav-emoji">▶</span>BulTube</button>
        <button class="nav-link" data-nav="bul://coins"><span class="nav-emoji">◈</span>Мои BulCoin</button>
        <button class="nav-link attention" data-nav="bul://enemies"><span class="nav-emoji">★</span>Враги народа</button>
        <button class="nav-link peel-link" data-nav="potatopeel.bul"><span class="nav-emoji">♨</span>POTATOPEEL <span class="tiny-badge">18+</span></button>
      </div>
      <div class="nav-bottom"><span class="satire-dot"></span> ПАРОДИЯ, НЕ НАСТОЯЩИЙ БРАУЗЕР <span class="nav-version">v.1.0</span></div>
    </nav>
    <div id="view" class="view" tabindex="-1"></div>
  </div>
  <div id="popover" class="popover" hidden></div>
  <div id="modal" class="modal-host" hidden></div>
  <div id="toast" class="toast-host" aria-live="polite"></div>
</div>
<script src="app.js" defer></script>
</body>
</html>
